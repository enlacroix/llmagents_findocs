services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: findocs
      POSTGRES_USER: findocs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findocs}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findocs -d findocs"]
      interval: 2s
      retries: 30

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://findocs:${POSTGRES_PASSWORD:-findocs}@db:5432/findocs
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
